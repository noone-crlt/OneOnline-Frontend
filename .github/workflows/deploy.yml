name: Frontend CI and Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

concurrency:
  group: deploy-frontend-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/noone-crlt/oneonline-frontend:latest
            ghcr.io/noone-crlt/oneonline-frontend:${{ github.sha }}

      - name: Update deploy branch
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:deploy --force
