name: Frontend CI and update deploy branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: deploy-frontend-main
  cancel-in-progress: false

jobs:
  test-build-update-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Update deploy branch
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:deploy --force
