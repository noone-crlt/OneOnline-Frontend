name: Frontend CI and Deploy Artifacts

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: deploy-frontend-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Publish source and dist to deploy branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -d dist
          test -s dist/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          git commit -m "deploy: frontend build $GITHUB_SHA"
          git push origin HEAD:deploy --force
